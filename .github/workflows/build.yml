name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Cache FFmpeg bundles
        uses: actions/cache@v4
        with:
          path: mod/build/ffmpeg-cache
          key: ffmpeg-bundles-${{ runner.os }}-n9.0-v1
          restore-keys: |
            ffmpeg-bundles-${{ runner.os }}-

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MikuVideo-Artifacts
          if-no-files-found: error
          path: |
            plugin/build/libs/MikuVideo-*.jar
            mod/build/libs/MikuVideo-Client-*.jar